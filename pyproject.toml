[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifast"
version = "0.1.0"
authors = [
  { name="Verifast Team", email="info@verifast.io" },
]
description = "A lightweight cross-country phone and email validation library."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/ajie9988/verifast"
